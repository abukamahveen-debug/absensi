<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Absensi Tukang · PT. Ecolum Pandu Aluvia</title>
  <meta name="theme-color" content="#1b2e24">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- LOGIN: cukup ketik nama -->
  <main id="v-login" class="login hidden">
    <div class="login-card">
      <img class="login-logo" src="assets/logo.png" alt="PT. Ecolum Pandu Aluvia">
      <h1>Absensi Tukang</h1>
      <p class="muted">Ketik nama Anda sesuai data tukang, lalu tekan Masuk.</p>
      <form id="f-login" novalidate>
        <label class="field"><span>Nama Tukang</span>
          <input id="in-nama" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="contoh: Budi Santoso" required>
        </label>
        <p id="login-err" class="alert alert-bad hidden" role="alert"></p>
        <button id="btn-login" class="btn btn-primary btn-lg btn-block" type="submit">Masuk</button>
      </form>
    </div>
    <p class="login-foot">© PT. Ecolum Pandu Aluvia</p>
  </main>

  <!-- APLIKASI -->
  <div id="v-app" class="hidden">
    <header class="t-top">
      <img src="assets/logo.png" alt="">
      <div class="who"><b id="who-nama"></b><span id="who-jabatan"></span></div>
      <button id="btn-keluar" class="btn btn-ghost btn-sm" type="button">Keluar</button>
    </header>
    <main id="page" class="t-main"></main>
    <nav class="tabbar" aria-label="Menu">
      <button data-tab="masuk" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Masuk</button>
      <button data-tab="riwayat" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Riwayat</button>
      <button data-tab="lembur" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>Lembur</button>
    </nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/tukang.js"></script>
</body>
</html>
